<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Fixtronix</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" type="image/x-icon" href="favicon.ico" />
        <!-- Inter — used by the redesigned modals (Procès-Verbal, Diagnostic).
             display=swap keeps it non-blocking; the components fall back to the
             system stack until it loads. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="manifest" href="manifest.webmanifest" />
        <meta name="theme-color" content="#1976d2" />
        <!-- Seule source du thème PrimeNG : LayoutService.replaceThemeLink() échange
             ce href à l'exécution. Ne JAMAIS rebundler un thème via angular.json ou
             styles.scss — le bundle est injecté après ce lien et gagnerait la cascade,
             rendant le changement de thème silencieusement sans effet. -->
        <link
            id="theme-css"
            rel="stylesheet"
            type="text/css"
            href="assets/layout/styles/theme/lara-light-blue/theme.css"
        />
        <!-- Applique le mode sombre AVANT le premier rendu : sans cela la page
             peint en clair puis bascule (flash blanc). Doit rester après le lien
             #theme-css (il est lu ici) et avant le bundle Angular. -->
        <script>
            (function () {
                try {
                    // Doit rester aligne sur FOLLOW_SYSTEM_COLOR_SCHEME dans
                    // app.layout.service.ts. A false tant que le bouton de
                    // bascule est masque : sans bouton, suivre le systeme
                    // enfermerait l'utilisateur en mode sombre.
                    var followSystem = false;
                    var stored = localStorage.getItem('fx-color-scheme');
                    var dark =
                        stored === 'dark' ||
                        (followSystem &&
                            stored !== 'light' &&
                            window.matchMedia &&
                            window.matchMedia('(prefers-color-scheme: dark)')
                                .matches);
                    if (!dark) return;
                    document.documentElement.classList.add('app-dark');
                    var link = document.getElementById('theme-css');
                    if (link) {
                        link.setAttribute(
                            'href',
                            'assets/layout/styles/theme/lara-dark-blue/theme.css'
                        );
                    }
                    var meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.setAttribute('content', '#111827');
                } catch (e) {
                    /* localStorage indisponible (navigation privée) : on reste en clair. */
                }
            })();
        </script>
    </head>

    <body>
        <app-root></app-root>
        <noscript
            >Please enable JavaScript to continue using this
            application.</noscript
        >
    </body>
</html>
