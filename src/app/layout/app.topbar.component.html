<div class="layout-topbar">
    <a class="layout-topbar-logo" routerLink="">
        <img
            src="assets/layout/images/{{
                layoutService.config().colorScheme === 'light'
                    ? 'Fixtronix-logo'
                    : 'Fixtronix-logo'
            }}.png"
            alt="logo"
        />
    </a>

    <button
        #menubutton
        class="p-link layout-menu-button layout-topbar-button"
        (click)="layoutService.onMenuToggle()"
    >
        <i class="pi pi-bars"></i>
    </button>

    <button
        #topbarmenubutton
        class="p-link layout-topbar-menu-button layout-topbar-button"
        (click)="layoutService.showProfileSidebar()"
    >
        <i class="pi pi-ellipsis-v"></i>
    </button>

    <div
        #topbarmenu
        class="layout-topbar-menu"
        [ngClass]="{
            'layout-topbar-menu-mobile-active':
                layoutService.state.profileSidebarVisible
        }"
    >
        <div *ngIf="!isOnline" class="connection-message">
            You are offline. Some features may not be available.
        </div>
        <div *ngIf="isOnline && isSlowConnection" class="connection-message">
            Your connection is slow. Performance may be affected.
        </div>

        <!-- ── Cloche notifications ERP (compteur non-lus + panneau) ───────── -->
        <div class="topbar-bell">
            <button
                type="button"
                class="p-link layout-topbar-button topbar-bell__btn"
                (click)="toggleBell()"
                aria-label="Notifications"
            >
                <i class="pi pi-bell"></i>
                <span *ngIf="erpUnread > 0" class="topbar-bell__badge">{{
                    erpUnread > 99 ? "99+" : erpUnread
                }}</span>
            </button>

            <div class="topbar-bell__panel" *ngIf="bellOpen">
                <div class="topbar-bell__head">
                    <strong>Notifications</strong>
                    <span class="topbar-bell__head-actions">
                        <button
                            type="button"
                            class="p-link"
                            (click)="toggleErpSound()"
                            [title]="
                                erpSoundOn ? 'Couper le son' : 'Activer le son'
                            "
                        >
                            <i
                                class="pi"
                                [ngClass]="
                                    erpSoundOn ? 'pi-volume-up' : 'pi-volume-off'
                                "
                            ></i>
                        </button>
                        <button
                            type="button"
                            class="p-link"
                            (click)="markAllErpRead()"
                            title="Tout marquer comme lu"
                        >
                            <i class="pi pi-check"></i>
                        </button>
                    </span>
                </div>
                <div class="topbar-bell__list">
                    <div
                        *ngIf="erpNotifications.length === 0"
                        class="topbar-bell__empty"
                    >
                        Aucune notification
                    </div>
                    <button
                        type="button"
                        *ngFor="let n of erpNotifications"
                        class="topbar-bell__item"
                        [class.topbar-bell__item--unread]="!n.readAt"
                        (click)="onErpNotifClick(n)"
                    >
                        <span
                            class="topbar-bell__dot"
                            *ngIf="!n.readAt"
                        ></span>
                        <span class="topbar-bell__msg">{{ n.message }}</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Utilisateur connecté : initiales + nom + rôle → menu (Se déconnecter) -->
        <div class="topbar-user">
            <button
                type="button"
                class="topbar-user__trigger"
                (click)="userMenu.toggle($event)"
                aria-haspopup="true"
                aria-label="Menu utilisateur"
            >
                <p-avatar
                    [label]="initials"
                    shape="circle"
                    styleClass="topbar-user__avatar"
                ></p-avatar>
                <span class="topbar-user__meta">
                    <span class="topbar-user__name">{{ userName }}</span>
                    <span class="topbar-user__role">{{ roleLabel }}</span>
                </span>
                <i class="pi pi-angle-down topbar-user__caret"></i>
            </button>
            <p-menu
                #userMenu
                [model]="userMenuItems"
                [popup]="true"
                appendTo="body"
                styleClass="topbar-user__menu"
            ></p-menu>
        </div>
    </div>
    <p-dialog
        header="Déconnexion"
        [modal]="true"
        [(visible)]="visible"
        [position]="position"
        [style]="{ width: '25rem' }"
    >
        <span class="p-text-secondary block mb-5">
            Voulez-vous vous déconnecter&nbsp;?
        </span>

        <div class="flex justify-content-end gap-2">
            <p-button
                label="Annuler"
                severity="secondary"
                (onClick)="visible = false"
            />
            <p-button
                label="Se déconnecter"
                icon="pi pi-sign-out"
                (onClick)="yes()"
            />
        </div>
    </p-dialog>
    <p-dialog
        header="Notifications"
        [modal]="true"
        [(visible)]="visibleNotification"
        [position]="positionNotification"
        [style]="{ width: '25rem' }"
        [contentStyle]="{ 'overflow-y': 'auto' }"
        resizable="true"
    >
        <ng-container *ngFor="let notification of allNotification">
            <p-card class="flex justify-content-between">
                <p>type: {{ notification.type }}</p>
                <p>title: {{ notification.message }}</p>

                <p-button
                    icon="pi pi-check"
                    (onClick)="markAsSeen(notification._id)"
                    [disabled]="disabledButtons[notification._id]"
                />
                <ng-container
                    *ngIf="notification.type === 'CONFIRMATION_COMPOSANT'"
                >
                    <p-button
                        label="Consulter les composants"
                        (onClick)="
                            getComposant(notification._id, notification._idDoc)
                        "
                    >
                    </p-button>
                </ng-container>
            </p-card>
            <!-- Add Button -->
        </ng-container>
    </p-dialog>

    <p-dialog
        header="Composant"
        [modal]="true"
        [(visible)]="openModalComposant"
        [style]="{ width: '25rem' }"
        [contentStyle]="{ 'overflow-y': 'auto' }"
        resizable="false"
    >
        <div>
            <h1>Array of composant</h1>
            <p-button
                label="confirmer les composant"
                (onClick)="confirmAndSendItBackToMagasin()"
            >
            </p-button>
        </div>
        <!-- Add Button -->
    </p-dialog>
</div>
